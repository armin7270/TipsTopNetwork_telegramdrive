# ==============================================================================
# Nginx Reverse Proxy Configuration for TeleDrive
# Place in: /etc/nginx/sites-available/teledrive
# Link with: ln -s /etc/nginx/sites-available/teledrive /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your_domain_or_ip; # Replace with your domain or VPS IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is active)
    # return 301 https://$host$request_uri;

    # ==========================================================================
    # Global Upload & Streaming Settings
    # ==========================================================================
    # Crucial for TeleDrive: disable upload size limits
    client_max_body_size 0;

    # Timeouts for large multi-gigabyte chunk transfers
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable Buffering for Real-time Streaming and Chunk Uploads
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

