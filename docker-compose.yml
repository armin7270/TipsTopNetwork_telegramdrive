services:
  teledrive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teledrive_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - TELEDRIVE_ENV=production
      - TELEDRIVE_IN_MEMORY=1
      - TELEDRIVE_FAKE_TELEGRAM=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
